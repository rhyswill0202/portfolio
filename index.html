<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhys Williams</title>
<meta name="description" content="Rhys Williams. I design intuitive products and experiences through UX, research, and prototyping.">
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS  (change --accent to change the hover / string color)
   ========================================================= */
:root{
  --bg:#08090B;
  --text:#F3F2EE;
  --body-text:rgba(243,242,238,.80);
  --muted:rgba(243,242,238,.62);
  --faint:rgba(243,242,238,.40);
  --line:rgba(255,255,255,.12);
  --accent:#FFB547;
  --accent-rgb:255,181,71;
  --high:#FF7A66;
  --pad:clamp(20px,7vw,128px);
  --max:1184px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --display:'Cal Sans','Geist',system-ui,sans-serif;
  --body:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(var(--accent-rgb),.07), transparent 62%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
ul,ol{list-style:none}
::selection{background:rgba(var(--accent-rgb),.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.ico{width:18px;height:18px;flex:none}

/* =========================================================
   FROSTED GLASS  (applied to every button + interactive part)
   ========================================================= */
.glass{
  position:relative;isolation:isolate;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  transition:background .3s, border-color .3s, transform .45s var(--spring), color .25s, box-shadow .3s;
}
/* light that follows the mouse across glass */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.13), transparent 62%);
  opacity:0;transition:opacity .35s;
}
.glass:hover::before{opacity:1}
.glass:hover{border-color:rgba(255,255,255,.24)}

/* =========================================================
   NAV
   ========================================================= */
.nav{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;
  height:60px;border-radius:30px;display:flex;align-items:center;gap:2px;padding:0 8px;
  background:rgba(18,19,22,.45);
}
.nav:hover{transform:translateX(-50%)}
.nav-logo{font-family:var(--display);font-size:19px;letter-spacing:.01em;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;margin-right:4px;transition:color .25s, background .25s}
.nav-logo:hover{color:var(--accent);background:rgba(255,255,255,.08)}
.nav-links{position:relative;display:flex}
.nav-link{position:relative;z-index:1;height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;font-size:15px;font-weight:500;color:var(--muted);transition:color .25s}
.nav-link:hover,.nav-link.is-active{color:var(--text)}
.nav-ind{position:absolute;top:0;left:0;height:44px;width:0;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);opacity:0;pointer-events:none;
  transition:transform .5s var(--spring), width .5s var(--spring), opacity .25s}
.nav-progress{position:absolute;left:26px;right:26px;bottom:4px;height:2px;border-radius:2px;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,0));opacity:var(--po,0);transition:opacity .3s}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:26px;font-size:16px;font-weight:500;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:active{transform:scale(.97)}
.btn-sm{height:42px;padding:0 18px;font-size:15px;border-radius:21px;gap:8px}
.btn-solid{border-color:rgba(255,255,255,.5)}
.btn-solid:hover,.next:hover .btn-solid{background:var(--text);color:#0A0A0B;border-color:var(--text)}
.ico-arrow{transition:transform .45s var(--spring)}
.btn:hover .ico-arrow,.card:hover .ico-arrow,.next:hover .ico-arrow{transform:translateX(4px)}
.ico-back{transition:transform .45s var(--spring)}
.btn:hover .ico-back{transform:translateX(-4px)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;font-size:14px;color:var(--body-text)}
.chip:hover{transform:translateY(-2px);color:var(--text)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip.high .dot{background:var(--high)}

/* =========================================================
   LAYOUT
   ========================================================= */
#app.enter{animation:enter .6s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:calc(var(--max) + var(--pad) * 2);margin:0 auto;padding:0 var(--pad)}
.section{padding-top:128px}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,4.4vw,48px);line-height:1.05}
#projects,#contact{scroll-margin-top:100px}
.page-top{padding-top:148px}
.page-title{font-family:var(--display);font-weight:400;font-size:clamp(56px,8vw,96px);line-height:.95;outline:none}

/* =========================================================
   HERO
   ========================================================= */
.hero{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center start;text-align:left;padding:120px var(--pad) 110px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start}
.name{font-family:var(--display);font-weight:400;font-size:clamp(46px,11vw,140px);line-height:1;letter-spacing:-.005em;outline:none;cursor:default;user-select:none;-webkit-user-select:none}
.name .w{display:inline-block;white-space:nowrap}
.name .ch{
  display:inline-block;will-change:transform;
  transform:translateY(calc(var(--f,0) * -.1em)) scale(calc(1 + var(--f,0) * .2));
  color:var(--text);
  color:color-mix(in oklab, var(--accent) calc(var(--f,0) * 100%), var(--text));
  transition:transform .55s var(--spring), color .35s ease;
}
.name .ci{display:inline-block;animation:rise .9s var(--ease) both;animation-delay:calc(var(--i) * 45ms + 250ms)}
.name .ci.ready{animation:none}
.name .ci.ready.pop{animation:pop .65s var(--spring)}
@keyframes rise{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:none}35%{transform:scale(1.24) translateY(-.07em)}70%{transform:scale(.96)}100%{transform:none}}
.hero-sub{margin-top:26px;max-width:28ch;font-size:clamp(19px,2.3vw,28px);line-height:1.35;color:var(--muted);animation:rise .9s var(--ease) both .85s}
.hero-cta{margin-top:40px;animation:rise .9s var(--ease) both 1s}
.scroll-cue{position:absolute;left:50%;bottom:30px;width:1px;height:48px;transform:translateX(-50%);background:rgba(255,255,255,.12);overflow:hidden}
.scroll-cue span{position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--text);animation:cue 2.4s var(--ease) infinite 1.6s}
@keyframes cue{to{top:100%}}

/* =========================================================
   WORK CARDS
   ========================================================= */
.work-list{display:grid;gap:40px;margin-top:48px}
.card{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px;align-items:center;padding:14px;border-radius:26px}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.075)}
.card-media{border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:#15161A}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.card:hover .card-media img{transform:scale(1.045)}
.card-body{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-right:24px}
.card-title{font-family:var(--display);font-weight:400;font-size:clamp(26px,2.6vw,32px);line-height:1.1;transition:color .3s}
.card:hover .card-title{color:var(--accent)}
.card-desc{color:var(--muted);max-width:42ch}
.card-cta{margin-top:8px}

/* =========================================================
   CONTACT + FOOTER
   ========================================================= */
.contact{padding-top:144px}
.contact-note{margin-top:12px;color:var(--muted)}
.contact-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.copy{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:22px;font-size:clamp(16px,2vw,20px);font-weight:500;max-width:100%}
.copy:hover{transform:translateY(-3px);background:rgba(255,255,255,.09)}
.copy:active{transform:scale(.98)}
.copy-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.14);color:var(--accent);flex:none;transition:transform .45s var(--spring)}
.copy:hover .copy-ico{transform:rotate(-8deg) scale(1.06)}
.copy-val{overflow-wrap:anywhere}
.copy-hint{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);margin-left:6px;transition:color .25s}
.copy-hint .ico{width:14px;height:14px}
.copy:hover .copy-hint{color:var(--text)}
.copy.copied .copy-hint{color:var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:96px;padding-bottom:40px;color:var(--faint);font-size:14px}

/* =========================================================
   PROJECT PAGE
   ========================================================= */
.proj-head{padding-top:140px}
.proj-title{margin-top:40px;font-family:var(--display);font-weight:400;font-size:clamp(50px,7.5vw,104px);line-height:.95;outline:none}
.proj-sub{margin-top:20px;max-width:44ch;font-size:clamp(18px,2vw,23px);line-height:1.4;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.meta dt{font-size:14px;color:var(--faint);margin-bottom:6px}
.meta dd{font-size:16px;line-height:1.45}
.cover{margin-top:48px}

.sec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:26px;padding-top:120px}
.sec > .sec-title{grid-column:1 / 5;grid-row:1;font-family:var(--display);font-weight:400;font-size:clamp(28px,3vw,38px);line-height:1.1;padding-right:24px}
.sec > .t{grid-column:5 / 13}
.sec > .f{grid-column:1 / 13;margin:18px 0}
.sub{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.25;margin-top:18px}
.sec > .sub:first-of-type{margin-top:0}

.bul{display:grid;gap:14px;max-width:62ch}
.bul li{position:relative;padding-left:28px;color:var(--body-text);transition:color .25s}
.bul li::before{content:"";position:absolute;left:3px;top:.8em;width:10px;height:2px;border-radius:2px;background:var(--accent);transition:width .35s var(--spring)}
.bul li:hover{color:var(--text)}
.bul li:hover::before{width:16px}

.callout{padding:22px 24px;border-radius:18px;max-width:62ch}
.callout:hover{transform:translateY(-2px)}
.callout .lbl{font-size:14px;font-weight:500;color:var(--accent);margin-bottom:6px}
.callout p{color:var(--body-text)}

.finding-head{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.finding-head .sub{margin-top:0}

.fig{margin:0}
.frame{display:block;width:100%;border-radius:18px;overflow:hidden;background:#121317;border:1px solid var(--line);cursor:zoom-in;transition:border-color .3s, transform .6s var(--ease)}
.frame img{width:100%;height:auto;transition:transform 1s var(--ease)}
.frame:hover{border-color:rgba(255,255,255,.26)}
.frame:hover img{transform:scale(1.02)}
.fig figcaption{margin-top:12px;font-size:14px;line-height:1.5;color:var(--faint);max-width:70ch}
.fig figcaption strong{display:block;font-weight:500;font-size:16px;color:var(--text);margin-bottom:2px}
.ph{aspect-ratio:16/9;border-radius:18px;border-style:dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint);font-size:14px}
.ph .ico{width:28px;height:28px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.gallery .ph{aspect-ratio:4/3}

.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.step{display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:140px;padding:18px;border-radius:18px;font-size:15px;line-height:1.4;color:var(--body-text)}
.step:hover{transform:translateY(-4px);color:var(--text)}
.step .n{font-family:var(--display);font-size:30px;line-height:1;color:var(--faint);transition:color .3s}
.step:hover .n{color:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{padding:22px;border-radius:18px}
.tile:hover{transform:translateY(-4px)}
.tile h3{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;margin-bottom:8px;transition:color .3s}
.tile:hover h3{color:var(--accent)}
.tile p{font-size:15px;line-height:1.5;color:var(--muted)}

.persona{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:24px;border-radius:22px;max-width:62ch}
.persona:hover{transform:translateY(-3px)}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--accent-rgb),.15);color:var(--accent);font-family:var(--display);font-size:20px}
.persona h3{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.persona p{margin-top:6px;color:var(--body-text);font-size:16px}
.persona .chips{margin-top:14px}

.next-wrap{padding-top:140px}
.next{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:center;padding:14px 14px 14px 40px;border-radius:28px}
.next:hover{transform:translateY(-4px);background:rgba(255,255,255,.075)}
.next-kicker{font-size:14px;color:var(--faint)}
.next-title{font-family:var(--display);font-weight:400;font-size:clamp(34px,4vw,52px);line-height:1.02;margin-top:8px;transition:color .3s}
.next:hover .next-title{color:var(--accent)}
.next-text p{margin-top:12px;color:var(--muted);max-width:40ch}
.next-text .btn{margin-top:28px}
.next-media{border-radius:18px;overflow:hidden;aspect-ratio:16/10;background:#15161A}
.next-media img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.next:hover .next-media img{transform:scale(1.045)}
.back-all{display:flex;justify-content:center;margin-top:24px}

/* =========================================================
   ABOUT + RESUME
   ========================================================= */
.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start;margin-top:56px}
.about-grid .frame{aspect-ratio:3/4}
.about-grid .frame img{height:100%;object-fit:cover}
.about-text p{color:var(--body-text);max-width:60ch}
.about-text p + p{margin-top:22px}
.about-text .lead{font-size:clamp(19px,1.8vw,22px);line-height:1.5;color:var(--text)}
.about-text .btn-row{margin-top:40px}
.about-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:24px}
.about-photos .frame{aspect-ratio:4/3}
.about-photos .frame img{height:100%;object-fit:cover}

.resume-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px}
.resume-frame{margin-top:40px;border-radius:22px;overflow:hidden;height:min(1100px,calc(100vh - 120px));min-height:520px}
.resume-frame object,.resume-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.resume-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:32px;color:var(--muted)}

/* =========================================================
   TOAST, CURSOR LABEL, LIGHTBOX
   ========================================================= */
.toast{position:fixed;left:50%;bottom:28px;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 18px 12px 14px;border-radius:24px;font-size:15px;font-weight:500;
  background:rgba(22,23,26,.6);opacity:0;transform:translate(-50%,24px) scale(.96);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast .ico{color:var(--accent)}

.cchip{position:fixed;left:0;top:0;z-index:90;pointer-events:none}
.cchip-in{display:block;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;
  background:rgba(20,21,24,.5);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transform:translate(14px,14px) scale(.4);opacity:0;transition:opacity .2s, transform .4s var(--spring)}
.cchip.on .cchip-in{opacity:1;transform:translate(14px,14px) scale(1)}

.lb{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:5vh 4vw;background:rgba(5,6,8,.74);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:88vh;border-radius:14px;transform:scale(.95);transition:transform .5s var(--spring);cursor:zoom-out}
.lb.open img{transform:none}
.lb-close{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:24px;display:grid;place-items:center}
.lb-close:hover{transform:rotate(90deg)}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width:980px){
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .card{grid-template-columns:1fr;gap:20px}
  .card-body{padding:0 10px 12px}
  .sec{padding-top:88px}
  .sec > *{grid-column:1 / -1 !important}
  .sec > .sec-title{grid-row:auto}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .next{grid-template-columns:1fr;padding:14px}
  .next-text{padding:12px 12px 4px;order:2}
  .about-grid{grid-template-columns:1fr;gap:36px}
  .about-grid .frame{max-width:460px}
}
@media (max-width:560px){
  body{font-size:16px}
  .nav{top:12px;height:56px;padding:0 6px}
  .nav-link{padding:0 13px;font-size:14px}
  .tiles{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about-photos{grid-template-columns:1fr}
  .copy-hint span{display:none}
  .foot{flex-direction:column-reverse;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .name .ch{transform:none !important}
  .scroll-cue{display:none}
}
</style>
</head>
<body>

<nav class="nav glass" aria-label="Main">
  <a class="nav-logo" href="#/" aria-label="Home">RW</a>
  <div class="nav-links">
    <span class="nav-ind" aria-hidden="true"></span>
    <a class="nav-link" href="#/about" data-nav="about">About</a>
    <a class="nav-link" href="#/resume" data-nav="resume">Resume</a>
    <a class="nav-link" href="#/work" data-nav="work">Work</a>
  </div>
  <span class="nav-progress" aria-hidden="true"></span>
</nav>

<main id="app"></main>

<div class="toast glass" role="status" aria-live="polite"></div>
<div class="cchip" aria-hidden="true"><span class="cchip-in"></span></div>
<div class="lb" role="dialog" aria-modal="true" aria-label="Image preview">
  <button class="lb-close glass" aria-label="Close image"></button>
  <img alt="">
</div>

<script>
/* =========================================================
   EDIT YOUR CONTENT HERE
   Everything on the site comes from these objects.
   To add an image to an empty slot, paste its URL into src: "".
   ========================================================= */
const CONTACT = {
  phone: "973-803-6004",
  email: "rhyswilliams0202@gmail.com"
};

const RESUME_URL = "resume.pdf"; // put resume.pdf in the same folder as this file

const IMG = "https://framerusercontent.com/images/";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const FINE = matchMedia("(hover: hover) and (pointer: fine)").matches;
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const ic = (n, cls = "") => `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

function figure(b) {
  const cap = (b.caption || b.title)
    ? `<figcaption>${b.title ? `<strong>${esc(b.title)}</strong>` : ""}${esc(b.caption)}</figcaption>` : "";
  if (!b.src) {
    return `<figure class="fig"><div class="ph glass">${ic("image")}<span>Add image here</span></div>${cap}</figure>`;
  }
  const alt = b.alt || b.title || b.caption || "";
  return `<figure class="fig"><button class="frame" data-zoom="${esc(b.src)}" data-cursor="Expand" aria-label="Expand image${alt ? ": " + esc(alt) : ""}"><img src="${esc(b.src)}" alt="${esc(alt)}" loading="lazy"></button>${cap}</figure>`;
}

const bulletList = (items, cls = "t") => `<ul class="bul ${cls}">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;

function renderBlock(b) {
  switch (b.type) {
    case "bullets": return bulletList(b.items);
    case "sub": return `<h3 class="sub t">${esc(b.text)}</h3>`;
    case "callout": return `<div class="callout glass t"><div class="lbl">${esc(b.label)}</div><p>${esc(b.text)}</p></div>`;
    case "chips": return `<div class="chips t">${b.items.map(i => `<span class="chip glass">${esc(i)}</span>`).join("")}</div>`;
    case "image": return `<div class="f">${figure(b)}</div>`;
    case "gallery": return `<div class="gallery f">${b.items.map(figure).join("")}</div>`;
    case "steps": return `<ol class="steps f">${b.items.map((s, i) => `<li class="step glass"><span class="n">${i + 1}</span><span>${esc(s)}</span></li>`).join("")}</ol>`;
    case "tiles": return `<div class="tiles f">${b.items.map(t => `<div class="tile glass"><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></div>`).join("")}</div>`;
    case "persona": return `
      <div class="persona glass t">
        <div class="avatar" aria-hidden="true">${esc(b.initials)}</div>
        <div>
          <h3>${esc(b.name)}</h3>
          <p>${esc(b.text)}</p>
          <div class="chips"><span class="chip glass">${esc(b.goal)}</span><span class="chip glass">${esc(b.pain)}</span></div>
        </div>
      </div>`;
    case "finding": return `
      <div class="finding-head t">
        <h3 class="sub">${esc(b.title)}</h3>
        <div class="chips">
          <span class="chip glass ${b.priority}"><i class="dot" aria-hidden="true"></i>${b.priority === "high" ? "High priority" : "Medium priority"}</span>
          <span class="chip glass">${esc(b.tag)}</span>
        </div>
      </div>
      ${bulletList(b.bullets)}
      <div class="callout glass t"><div class="lbl">Recommendation</div><p>${esc(b.fix)}</p></div>
      ${b.image ? `<div class="f">${figure(b.image)}</div>` : ""}`;
    default: return "";
  }
}

function copyBtn(icon, val, label) {
  return `<button class="copy glass" data-copy="${esc(val)}" data-label="${esc(label)}" aria-label="Copy ${esc(label.toLowerCase())}: ${esc(val)}">
    <span class="copy-ico">${ic(icon)}</span>
    <span class="copy-val">${esc(val)}</span>
    <span class="copy-hint">${ic("copy")}<span>Copy</span></span>
  </button>`;
}

    `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="ch"><span class="ci" style="--i:${i++}">${c}</span></span>`).join("")}</span>`
  ).join(" ");
}

    const next = PROJECTS[(i + 1) % PROJECTS.length];
    return `
    <article>
      <header class="wrap proj-head">
        <a class="btn btn-sm glass" href="#/work">${ic("arrowL", "ico-back")}All work</a>
        <h1 class="proj-title" tabindex="-1">${esc(p.title)}</h1>
        <p class="proj-sub">${esc(p.subtitle)}</p>
        <dl class="meta">${p.meta.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>
      </header>
      <div class="wrap cover">${figure({ src: p.cover, alt: p.title })}</div>
      <div class="wrap">
        ${p.sections.map(s => `<section class="sec"><h2 class="sec-title">${esc(s.title)}</h2>${s.blocks.map(renderBlock).join("")}</section>`).join("")}
      </div>
      <div class="wrap next-wrap">
        <a class="next glass" href="#/work/${next.id}">
          <div class="next-text">
            <span class="next-kicker">Up next</span>
            <h2 class="next-title">${esc(next.title)}</h2>
            <p>${esc(next.card)}</p>
            <span class="btn btn-solid glass">Next project ${ic("arrowR", "ico-arrow")}</span>
          </div>
          <div class="next-media" data-cursor="Next project"><img src="${esc(next.cover)}" alt="" loading="lazy"></div>
        </a>
        <div class="back-all"><a class="btn btn-sm glass" href="#/work">${ic("arrowL", "ico-back")}Back to all work</a></div>
      </div>
    </article>`;
  }
};

/* =========================================================
   HERO: STRINGS + NAME
   Lines part around your name like strings, and pluck when
   the mouse crosses them. Click the hero to strum them all.
   ========================================================= */
function initHero(hero) {
  const canvas = $("canvas", hero);
  const block = $(".hero-inner", hero);
  const ctx = canvas.getContext("2d");
  const chars = $$(".ch", hero);
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent-rgb").split(",").map(Number);

  let W = 0, H = 0, lines = [], box = { cx: 0, cy: 0, hw: 0, hh: 0 }, centers = [];
  let raf = 0, visible = true, start = performance.now();
  const m = { x: -1e4, y: -1e4, in: false };

  function measure() {
    const r = hero.getBoundingClientRect();
    const b = block.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    box = { cx: b.left - r.left + b.width / 2, cy: b.top - r.top + b.height / 2, hw: b.width / 2, hh: b.height / 2 };
    const n = 6;
    const top = H * 0.08, bot = H * 0.92;
    const prev = lines;
    lines = [];
    for (let i = 0; i < n; i++) {
      const old = prev[i];
      lines.push({
        idx: i, y0: top + (bot - top) * (i / (n - 1)),
        amp: 0, t: 0, px: W / 2, dir: 1,
        ph: old ? old.ph : Math.random() * Math.PI * 2,
        sp: old ? old.sp : 0.00035 + Math.random() * 0.00025,
        k: old ? old.k : 0.003 + Math.random() * 0.002
      });
    }
    centers = chars.map(c => {
      const cr = c.getBoundingClientRect();
      return { x: cr.left - r.left + cr.width / 2, y: cr.top - r.top + cr.height / 2 };
    });
    if (REDUCE) draw(performance.now());
  }

  // resting position of a line at x: it bows around the text block, plus a slow drift
  function baseY(L, x, now) {
    const gap = 26, inner = box.hh + gap, R = inner * 1.9;
    let y = L.y0;
    const d = y - box.cy, ad = Math.abs(d);
    if (ad < R) {
      const s = d === 0 ? (L.idx % 2 ? 1 : -1) : Math.sign(d);
      const target = inner + ad * (R - inner) / R;
      const dx = (x - box.cx) / (box.hw + 150);
      const g = Math.exp(-(dx * dx * dx * dx));
      y += s * (target - ad) * g;
    }
    if (!REDUCE) {
      y += Math.sin(x * L.k + now * L.sp + L.ph) * 5 + Math.sin(x * L.k * 0.43 - now * L.sp * 1.3 + L.ph * 2) * 3;
    }
    return y;
  }

  // plucked-string vibration
  function vib(L, x, now) {
    if (L.amp <= 0) return 0;
    const age = now - L.t;
    const a = L.amp * Math.exp(-age / 550);
    if (a < 0.05) { L.amp = 0; return 0; }
    const env = x < L.px ? x / L.px : (W - x) / (W - L.px);
    return L.dir * (a * env * Math.sin(age * 0.03) + a * 0.12 * Math.sin(Math.PI * 2 * x / W) * Math.sin(age * 0.06));
  }

  function heat(L, now) {
    if (L.amp <= 0) return 0;
    return clamp(L.amp * Math.exp(-(now - L.t) / 750) / 16, 0, 1);
  }

  function pluck(L, x, dir, amp, now) {
    L.px = clamp(x, 30, W - 30); L.dir = dir; L.amp = amp; L.t = now;
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    const T = REDUCE ? 99 : (now - start) / 1000;
    const step = W < 640 ? 6 : 8;
    const mid = (lines.length - 1) / 2;
    for (const L of lines) {
      const delay = Math.abs(L.idx - mid) / mid * 0.45;
      const p = clamp((T - 0.1 - delay) / 1.1, 0, 1);
      const li = 1 - Math.pow(1 - p, 3);
      if (li <= 0) continue;
      const half = li * (W / 2 + 40);
      const x0 = Math.max(-step, box.cx - half), x1 = Math.min(W + step, box.cx + half);
      const h = heat(L, now);
      let near = 0;
      if (m.in) near = clamp(1 - Math.abs(baseY(L, m.x, now) - m.y) / 70, 0, 1) * 0.12;
      const r = Math.round(255 + (accent[0] - 255) * h);
      const g = Math.round(255 + (accent[1] - 255) * h);
      const bl = Math.round(255 + (accent[2] - 255) * h);
      ctx.strokeStyle = `rgba(${r},${g},${bl},${(0.11 + near + h * 0.6).toFixed(3)})`;
      ctx.lineWidth = 1 + h * 0.7;
      ctx.beginPath();
      for (let x = x0; x <= x1; x += step) {
        const y = baseY(L, x, now) + vib(L, x, now);
        x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (visible && !document.hidden) draw(now);
  }

  // pointer: pluck strings you cross + magnify letters near the cursor
  function onMove(e) {
    const r = hero.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const now = performance.now();
    if (m.in && !REDUCE) {
      for (const L of lines) {
        const ly = baseY(L, x, now);
        if ((m.y - ly) * (y - ly) < 0) {
          const v = clamp(Math.abs(y - m.y) / 40, 0, 1);
          pluck(L, x, y > m.y ? 1 : -1, 3 + v * 6, now);
        }
      }
    }
    m.x = x; m.y = y; m.in = true;
    // letters
    chars.forEach((c, i) => {
      const cc = centers[i]; if (!cc) return;
      const d = Math.hypot(x - cc.x, (y - cc.y) * 1.5);
      const f = clamp(1 - d / 170, 0, 1);
      c.style.setProperty("--f", (f * f * (3 - 2 * f)).toFixed(3));
    });
  }
  function onLeave() {
    m.in = false; m.x = m.y = -1e4;
    chars.forEach(c => c.style.setProperty("--f", 0));
  }
  function strum(x) {
    const now = performance.now();
    lines.forEach((L, i) => setTimeout(() => pluck(L, x, i % 2 ? 1 : -1, 12, performance.now()), i * 32));
  }
  function wave() {
    chars.forEach((c, i) => setTimeout(() => pop(c.firstElementChild), i * 45));
  }
  function pop(ci) {
    if (!ci.classList.contains("ready") || ci.classList.contains("pop")) return;
    ci.classList.add("pop");
  }
  function onClick(e) {
    if (e.target.closest("a,button")) return;
    const r = hero.getBoundingClientRect();
    strum(e.clientX - r.left);
    if (e.target.closest(".name")) wave();
  }

  chars.forEach(c => {
    const ci = c.firstElementChild;
    if (REDUCE) ci.classList.add("ready");
    ci.addEventListener("animationend", e => {
      if (e.animationName === "rise") ci.classList.add("ready");
      if (e.animationName === "pop") ci.classList.remove("pop");
    });
    c.addEventListener("pointerenter", () => pop(ci));
  });

  hero.addEventListener("pointermove", onMove);
  hero.addEventListener("pointerleave", onLeave);
  hero.addEventListener("click", onClick);

  const ro = new ResizeObserver(measure); ro.observe(hero);
  const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; }); io.observe(hero);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
  // letters finish their entrance at ~1.1s; re-measure so letter centers are exact
  const t = setTimeout(measure, 1300);

  measure();
  if (!REDUCE) raf = requestAnimationFrame(loop);

  return () => {
    cancelAnimationFrame(raf); clearTimeout(t); ro.disconnect(); io.disconnect();
    hero.removeEventListener("pointermove", onMove);
    hero.removeEventListener("pointerleave", onLeave);
    hero.removeEventListener("click", onClick);
  };
}

/* =========================================================
   RESUME LOADER
   ========================================================= */
function initResume() {
  const frame = $("#resumeFrame");
  const empty = `<div class="resume-empty"><p>The resume preview can’t load here. Use the buttons above to open or download it.</p></div>`;
  fetch(RESUME_URL, { method: "HEAD" })
    .then(res => {
      frame.innerHTML = res.ok
        ? `<iframe src="${esc(RESUME_URL)}#view=FitH" title="Rhys Williams resume"></iframe>`
        : empty;
    })
    .catch(() => { frame.innerHTML = empty; });
}

/* =========================================================
   ROUTER
   ========================================================= */
const app = $("#app");
const nav = $(".nav");
let cleanup = null;
let current = "";
let first = true;

function parse() {
  const [a = "", b = ""] = location.hash.replace(/^#\/?/, "").split("/");
  if (a === "about") return { page: "about" };
  if (a === "resume") return { page: "resume" };
  if (a === "work" && b) {
    const p = PROJECTS.find(x => x.id === b);
    if (p) return { page: "project:" + p.id, project: p };
  }
  return { page: "home", scrollTo: a === "work" ? "projects" : null };
}

function route() {
  const r = parse();
  if (r.page === current && r.page === "home") {
    if (r.scrollTo) $("#" + r.scrollTo)?.scrollIntoView({ behavior: REDUCE ? "auto" : "smooth" });
    else window.scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" });
    updateNav();
    return;
  }
  if (cleanup) { cleanup(); cleanup = null; }
  current = r.page;

  let html, title = "Rhys Williams";
  if (r.page === "about") { html = pages.about(); title = "About | Rhys Williams"; }
  else if (r.page === "resume") { html = pages.resume(); title = "Resume | Rhys Williams"; }
  else if (r.project) { html = pages.project(r.project); title = r.project.title + " | Rhys Williams"; }
  else html = pages.home();

  app.innerHTML = html + contactAndFooter();
  document.title = title;
  app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");

  if (r.page === "home") cleanup = initHero($(".hero"));
  if (r.page === "resume") initResume();

  if (r.scrollTo) {
    requestAnimationFrame(() => $("#" + r.scrollTo)?.scrollIntoView({ behavior: first || REDUCE ? "auto" : "smooth" }));
  } else {
    window.scrollTo({ top: 0, behavior: "instant" });
    if (!first) $("h1", app)?.focus({ preventScroll: true });
  }
  first = false;
  updateNav();
}

window.addEventListener("hashchange", route);

// clicking a link to the page you're already on still does something useful
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && a.getAttribute("href") === (location.hash || "#/")) { e.preventDefault(); route(); }
  const top = e.target.closest("[data-top]");
  if (top) window.scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" });
});

/* =========================================================
   NAV: sliding pill + scroll progress
   ========================================================= */
const ind = $(".nav-ind");
const navLinks = $$(".nav-link");
function activeKey() {
  if (current === "about") return "about";
  if (current === "resume") return "resume";
  if (current.startsWith("project:")) return "work";
  const pr = $("#projects");
  if (pr && pr.getBoundingClientRect().top < innerHeight * 0.55) return "work";
  return null;
}
function moveInd(el) {
  if (!el) { ind.style.opacity = 0; return; }
  ind.style.opacity = 1;
  ind.style.width = el.offsetWidth + "px";
  ind.style.transform = `translateX(${el.offsetLeft}px)`;
}
function updateNav() {
  const key = activeKey();
  navLinks.forEach(l => {
    const on = l.dataset.nav === key;
    l.classList.toggle("is-active", on);
    if (on) l.setAttribute("aria-current", "page"); else l.removeAttribute("aria-current");
  });
  if (!$(".nav-links").matches(":hover")) moveInd(navLinks.find(l => l.dataset.nav === key));
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? clamp(scrollY / max, 0, 1) : 0;
  nav.style.setProperty("--p", p.toFixed(4));
  nav.style.setProperty("--po", current !== "home" || p > 0.02 ? 1 : 0);
}
navLinks.forEach(l => l.addEventListener("pointerenter", () => moveInd(l)));
$(".nav-links").addEventListener("pointerleave", () => moveInd(navLinks.find(l => l.dataset.nav === activeKey())));
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { updateNav(); ticking = false; });
}, { passive: true });
window.addEventListener("resize", updateNav);

/* =========================================================
   GLASS LIGHT + MAGNETIC BUTTONS
   ========================================================= */
if (FINE) {
  let magEl = null;
  document.addEventListener("pointermove", e => {
    for (let el = e.target; el && el !== document.body; el = el.parentElement) {
      if (el.classList && el.classList.contains("glass")) {
        const r = el.getBoundingClientRect();
        el.style.setProperty("--mx", (e.clientX - r.left) + "px");
        el.style.setProperty("--my", (e.clientY - r.top) + "px");
      }
    }
    if (REDUCE) return;
    const mg = e.target.closest(".magnetic");
    if (magEl && magEl !== mg) { magEl.style.transform = ""; magEl = null; }
    if (mg) {
      const r = mg.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      mg.style.transform = `translate(${dx * 0.18}px, ${dy * 0.3}px)`;
      magEl = mg;
    }
  }, { passive: true });
}

/* =========================================================
   CURSOR LABEL ("View project", "Expand", "Next project")
   ========================================================= */
if (FINE) {
  const chip = $(".cchip"), inner = $(".cchip-in");
  let tx = -100, ty = -100, x = -100, y = -100, on = false;
  document.addEventListener("pointermove", e => {
    tx = e.clientX; ty = e.clientY;
    const t = e.target.closest("[data-cursor]");
    if (t) {
      if (inner.textContent !== t.dataset.cursor) inner.textContent = t.dataset.cursor;
      if (!on) { on = true; x = tx; y = ty; chip.classList.add("on"); }
    } else if (on) { on = false; chip.classList.remove("on"); }
  }, { passive: true });
  window.addEventListener("scroll", () => { if (on) { on = false; chip.classList.remove("on"); } }, { passive: true });
  (function follow() {
    x += (tx - x) * 0.22; y += (ty - y) * 0.22;
    chip.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    requestAnimationFrame(follow);
  })();
}

/* =========================================================
   COPY PHONE / EMAIL
   ========================================================= */
const toast = $(".toast");
let toastTimer = 0;
function showToast(msg) {
  toast.innerHTML = ic("check") + `<span>${esc(msg)}</span>`;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const ok = await copyText(btn.dataset.copy);
  const hint = $(".copy-hint", btn);
  if (ok) {
    btn.classList.add("copied");
    hint.innerHTML = ic("check") + "<span>Copied</span>";
    showToast(btn.dataset.label + " copied");
    setTimeout(() => { btn.classList.remove("copied"); hint.innerHTML = ic("copy") + "<span>Copy</span>"; }, 1800);
  } else {
    showToast("Copy didn't work here. Select the text instead.");
  }
});

/* =========================================================
   LIGHTBOX
   ========================================================= */
const lb = $(".lb"), lbImg = $(".lb img"), lbClose = $(".lb-close");
lbClose.innerHTML = ic("close");
let lastFocus = null;
function openLb(src, alt) {
  lastFocus = document.activeElement;
  lbImg.src = src; lbImg.alt = alt || "";
  lb.classList.add("open");
  lbClose.focus({ preventScroll: true });
}
function closeLb() {
  lb.classList.remove("open");
  lastFocus && lastFocus.focus({ preventScroll: true });
}
document.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (z) { openLb(z.dataset.zoom, $("img", z)?.alt); return; }
  if (lb.classList.contains("open") && (e.target === lb || e.target === lbImg || e.target.closest(".lb-close"))) closeLb();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("open")) closeLb(); });

/* go */
route();
</script>
